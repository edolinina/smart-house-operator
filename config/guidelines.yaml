power_saving_thresholds: >
  - **Normal**: < 1500 W
  - **Moderate**: 1500–2500 W  
  - **Critical**: > 2500 W

ac_guidelines: >
  - Always consider and balance the temperature preferences of all personas currently at home
  - Adjust AC temperature to 24°C during May - September (summer) and set mode to 'cool'.  
  - Set mode to 'heat' and adjust heating temperature to 23°C during December - March (winter).  
  - During May - September if outside temperature is lower than inside temperature and AC is up, turn it off.
  - During December - March if outside temperature is higher than inside temperature and AC is up, turn it off.
  - If wind speed > 20 km/h and outside temperature is lower than inside temperature, **turn off AC cooling** to prefer natural ventilation.
  - If wind direction is from the north (cool wind in local climate) and outside temperature < 18°C, **reduce heating demand** by 1°C.  
  - If wind direction is from the south (hot wind in local climate) and outside temperature > 30°C, **increase cooling priority** for AC.
  - If humidity > 70%, reduce target temperature by 1°C for better comfort.
  - If humidity < 30% switch fan to low mode.
  - When cloud cover is > 90% and outside temperature < 15°C, **increase heating priority** by 1°C.
  - When power consumption reaches Moderate level - raise cooling setpoint by +1°C (summer) or lower heating setpoint by –1°C (winter).
  - When power consumption reaches Critical level - raise/lower temperature by +2°C/–2°C and switch fan to low mode.

lights_guidelines: >
  - Always consider and balance the brightness preferences of all personas currently at home
  - Turn off lights during bright daytime hours (after sunrise + 1 hour, until sunset – 1 hour) if cloud cover < 90%.
  - Use cold light during the morning (6:00-8:00) and warm at the evening hours (17:00 - 21:00).
  - Gradually increase brightness in the morning (06:00- 08:00) to simulate sunrise and reduce abrupt power usage.
  - Dim lights to 50% during late evening hours (after 21:00).
  - During high humidity (>75%), slightly warm the light tone to improve comfort perception.
  - When power consumption reaches Moderate level - dim all lights by 30%.
  - When power consumption reaches Critical level - reduce the current brightness by 50%.

fridge_guidelines: >
  - Set fridge temperature to 3°C if outside temperature exceeds 30°C, otherwise keep it at 4°C.
  - Set freezer temperature to -20°C if outside temperature exceeds 30°C, otherwise keep it at -18°C.

shutter_guidelines: >
  - Adjust window shutters based on external light level, wind speed, and time of day.
  - At sunrise, gradually open shutters to 50–80% to let in natural light.
  - At sunset, close shutters gradually to 80–100% to preserve privacy and retain indoor heat.
  - If wind speed > 30 km/h, **partially close shutters (50%)** to protect windows and reduce drafts.
  - If cloud cover > 65% during daytime, open shutters wider to improve natural lighting.
